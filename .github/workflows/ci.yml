name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      # Pinned constraints: CI resolves the same versions the suite was written
      # against (no Docker, model, or LLM needed — SQLite + fake embedder).
      - name: Install dependencies (pinned)
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Type-check and build
        run: npm run build
      # Keep the dev toolchain patched: fail on a high/critical advisory
      # (the esbuild/Vite dev-server disclosure was fixed by the Vite 6 bump).
      - name: Audit
        run: npm audit --audit-level=high
