name: CI

on:
  push:
    branches: [master]
  pull_request:

# NOTE — retrieval quality gates are NOT run here: scripts/retrieval_sanity.py
# needs a live Qdrant plus the real embedding model (~220 MB) and the indexed
# six-document baseline. After ANY retrieval change (BM25 analyzer, fusion,
# chunking, embedding, Qdrant filters), run it manually against the clean eval
# org before merging:
#   backend/.venv/Scripts/python scripts/retrieval_sanity.py --org "Lumen AI (eval M6)"
# Gates: doc R@5 >= 0.85, anchor R@5 >= 0.70, anchor R@10 >= 0.85, KB R@5 >= 0.60.

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres on host port 5433 (matches the dev compose + hardcoded test URLs)
    # so the migration-chain tests and the live PostgresSaver test RUN instead of
    # skipping — otherwise CI silently covers only the offline suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: int102
          POSTGRES_PASSWORD: int102
          POSTGRES_DB: int102
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U int102"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      INT102_LIVE_PG: "1"
      LANGGRAPH_STRICT_MSGPACK: "true"
      DATABASE_URL: postgresql+psycopg://int102:int102@localhost:5433/int102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      # Pinned constraints: CI resolves the same versions the suite was written
      # against (offline tests use SQLite + a fake embedder; the four live tests
      # use the Postgres service above).
      - name: Install dependencies (pinned)
        run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Run tests (incl. live Postgres migration + checkpointer)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Test (Vitest)
        run: npm run test
      # Fails on every high/critical advisory except ones documented in
      # scripts/audit-gate.mjs with a reason and a review date — and fails on a
      # stale or expired exception too. A bare `npm audit --audit-level=high`
      # cannot express "no fixed version is published and it does not apply
      # here", which leaves only permanent red or no gate at all.
      - name: Audit
        run: npm run audit:gate

  # M8 PDF export: the ONLY environment that authoritatively validates the
  # WeasyPrint native libraries (Pango/Cairo/fonts) is the backend Docker
  # image itself — a host venv can pass unit tests while the image lacks a
  # library. Build the image and render a real PDF inside it.
  backend-docker-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t int102-backend-ci backend
      - name: Render a PDF inside the image (native-lib smoke)
        run: |
          docker run --rm int102-backend-ci python -c "
          from weasyprint import HTML
          pdf = HTML(string='<h1>Test PDF — éàü</h1>').write_pdf()
          assert pdf.startswith(b'%PDF'), 'not a PDF'
          print('PDF OK,', len(pdf), 'bytes')
          "
