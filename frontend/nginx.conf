server {
    listen 80;

    # Security headers, server-level so BOTH locations inherit them (nginx only
    # inherits add_header when the inner level declares none — neither does).
    #
    # Deliberately NO Strict-Transport-Security: this server listens on plain
    # HTTP and SESSION_COOKIE_SECURE defaults to off, so HSTS would promise a
    # TLS endpoint that may not exist. Add it in the TLS-terminating layer, at
    # the same time as SESSION_COOKIE_SECURE=true.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # All assets are self-hosted (fonts come from @fontsource, bundled by Vite),
    # so 'self' is enough for every fetch directive. 'unsafe-inline' is kept for
    # scripts and styles because index.html runs an inline pre-paint theme script
    # and the UI libraries set inline style attributes — the CSP's job here is to
    # block EXTERNAL script/frame/form injection, not inline execution.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        # Nginx defaults to a 1 MB body; without this it would reject uploads
        # far below the backend's 20 MB limit with its own 413. Allow a small
        # margin above 20 MB for multipart framing and let FastAPI enforce the
        # exact file-size limit (and return the French error).
        client_max_body_size 21m;
        # Assessment creation indexes the corpus synchronously; on a cold
        # fastembed cache (first run) the model download makes that POST far
        # exceed the 60 s default read timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
