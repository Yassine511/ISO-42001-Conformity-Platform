#starts persistence , vector storage , fast api backend and react frontend together


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: int102
      POSTGRES_PASSWORD: int102
      POSTGRES_DB: int102
    ports:
      # 5433 on the host: many dev machines already run a native PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U int102"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant: #vector db for indexing and retrieval
    image: qdrant/qdrant:v1.18.2  # pinned: collection lifecycle is versioned, image should be too
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image ships no curl/wget; TCP probe on the HTTP port
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://int102:int102@postgres:5432/int102
      QDRANT_URL: http://qdrant:6333
      CORPUS_PATH: /app/corpus
      FASTEMBED_CACHE_DIR: /models/fastembed
      # strict checkpoint deserialization (LangGraph security advisory);
      # pipeline state carries only msgpack-safe primitives
      LANGGRAPH_STRICT_MSGPACK: "true"
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # KB JSON lives outside the build context; embedding model cache survives rebuilds
      - ./corpus:/app/corpus:ro
      - fastembed_cache:/models/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_data:
  fastembed_cache:
